name: Job Output Example

on: [push, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.step1.outputs.msg }}

    steps:
      - id: step1
        run: echo "msg=Hello from job1" >> $GITHUB_OUTPUT

  job2:
    runs-on: ubuntu-latest
    needs: job1 # mandatory

    steps:
      - name: Use output
        run: echo "Received: ${{ needs.job1.outputs.message }}"
